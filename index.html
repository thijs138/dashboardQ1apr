<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard (Q1 + April geïntegreerd)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;background:#f4f4f2;margin:0;padding:20px}
.kpi{background:#fff;padding:16px;margin-bottom:10px;border-radius:8px}
.kpi strong{font-size:22px}
</style>
</head>
<body>

<h2>Dashboard Q1 + April (volledig geïntegreerd)</h2>

<input type="file" id="fileInput" />

<div class="kpi">Totaal ingemeten (Q1 + April): <strong id="kpi_ing">-</strong></div>
<div class="kpi">Totaal besteld (Q1 + April): <strong id="kpi_best">-</strong></div>
<div class="kpi">Conversie totaal: <strong id="kpi_conv">-</strong></div>

<canvas id="chart"></canvas>

<script>
document.getElementById('fileInput').addEventListener('change', handleFile);

function handleFile(e){
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(e){
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type:'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    processData(json);
  };

  reader.readAsArrayBuffer(file);
}

function processData(rows){
  const unique = {};

  rows.forEach(r => {
    // sleutel bepalen (pas aan indien nodig)
    const key = r['Order'] || r['Ordernummer'] || r['Klant'] || JSON.stringify(r);
    unique[key] = r; // laatste status wint (dus updates verwerkt)
  });

  const orders = Object.values(unique);

  const ingemeten = orders.length;
  const besteld = orders.filter(o => o['Besteld'] !== undefined && o['Besteld'] !== '').length;
  const conversie = ((besteld / ingemeten) * 100).toFixed(1);

  document.getElementById('kpi_ing').innerText = ingemeten;
  document.getElementById('kpi_best').innerText = besteld;
  document.getElementById('kpi_conv').innerText = conversie + '%';

  renderChart(ingemeten, besteld);
}

function renderChart(ing, best){
  new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{
      labels:['Ingemeten totaal','Besteld totaal'],
      datasets:[{data:[ing,best]}]
    }
  });
}
</script>

</body>
</html>
